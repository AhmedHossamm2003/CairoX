<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Meridian CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: fixed dark command rail + cool working canvas; dense enterprise console, cards only where an object needs edges */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#F7F9FA; --line:#E0E6EA; --line-2:#ECF0F2;
  --fg:#0C1A24; --fg-2:#2B3A46; --muted:#62717D; --faint:#97A3AC;
  --accent:#0E7C72; --accent-hi:#0A685F; --accent-fg:#FFFFFF; --accent-soft:#E2F1EF;
  --brass:#A47A2C;
  --rail:#09141C; --rail-2:#122029; --rail-fg:#DCE5EA; --rail-muted:#7D8E9A; --rail-line:#1A2934;
  --good:#1C8655; --warn:#B26F17; --bad:#C0392F; --info:#2E64D4; --neutral:#6A7783;
  --c1:#0E7C72; --c2:#2E64D4; --c3:#A47A2C; --c4:#8A4FBF; --c5:#C0392F; --c6:#4F7A28;
  --shadow:0 1px 2px rgba(12,26,36,.05),0 10px 30px -14px rgba(12,26,36,.22);
  --shadow-lg:0 30px 80px -20px rgba(9,20,28,.45);
  --scrim:rgba(9,20,28,.42);
  --f-display:'Schibsted Grotesk','Segoe UI',system-ui,sans-serif;
  --f-body:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#081016; --surface:#0F1920; --surface-2:#0C151B; --line:#1D2A33; --line-2:#16222A;
  --fg:#E5ECF0; --fg-2:#C3CED5; --muted:#8B9AA5; --faint:#5F6E79;
  --accent:#3DB7A8; --accent-hi:#5ACABC; --accent-fg:#04201D; --accent-soft:#12302D;
  --brass:#D2B06A;
  --rail:#050C11; --rail-2:#0F1A21; --rail-fg:#DCE5EA; --rail-muted:#71838F; --rail-line:#15222B;
  --good:#3DBD82; --warn:#E0A64A; --bad:#EE6A60; --info:#6E9CF4; --neutral:#8796A1;
  --c1:#3DB7A8; --c2:#6E9CF4; --c3:#D2B06A; --c4:#B78AE6; --c5:#EE6A60; --c6:#8EBF5E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#081016; --surface:#0F1920; --surface-2:#0C151B; --line:#1D2A33; --line-2:#16222A;
  --fg:#E5ECF0; --fg-2:#C3CED5; --muted:#8B9AA5; --faint:#5F6E79;
  --accent:#3DB7A8; --accent-hi:#5ACABC; --accent-fg:#04201D; --accent-soft:#12302D;
  --brass:#D2B06A;
  --rail:#050C11; --rail-2:#0F1A21; --rail-fg:#DCE5EA; --rail-muted:#71838F; --rail-line:#15222B;
  --good:#3DBD82; --warn:#E0A64A; --bad:#EE6A60; --info:#6E9CF4; --neutral:#8796A1;
  --c1:#3DB7A8; --c2:#6E9CF4; --c3:#D2B06A; --c4:#B78AE6; --c5:#EE6A60; --c6:#8EBF5E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.rail{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;padding:18px 14px;gap:22px;border-right:1px solid var(--rail-line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,var(--accent),#0A4E48);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--rail-muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted);padding:10px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--rail-muted);text-decoration:none;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
.nav a:hover{background:var(--rail-2);color:var(--rail-fg)}
.nav a.on{background:var(--rail-2);color:#fff;box-shadow:inset 0 0 0 1px var(--rail-line)}
.nav a.on svg{color:var(--accent)}
.nav a .count{margin-left:auto;font-size:11px;font-weight:700;background:var(--brass);color:#1A1306;border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.nav a .live{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#35C489;box-shadow:0 0 0 3px rgba(53,196,137,.18)}
.rail-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid var(--rail-line)}
.rail-foot .who{font-weight:600;font-size:13px}
.rail-foot .role{font-size:11.5px;color:var(--rail-muted)}
.presence{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#7FD9B0}
.presence::before{content:"";width:7px;height:7px;border-radius:50%;background:#35C489}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--muted)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;color:var(--fg)}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.callpill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-weight:600;font-size:12.5px;background:var(--accent-soft);color:var(--accent);border:0}
.callpill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
.iconbtn{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.scroll{flex:1;overflow:auto}
.view{padding:26px 28px 48px;display:flex;flex-direction:column;gap:22px;max-width:1520px}

/* page head */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.phead h1{font-size:26px;font-weight:700}
.phead p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--fg);white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hi)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.lg{height:42px;padding:0 18px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-h h3{font-size:15px;font-weight:600}
.card-b{padding:16px 18px 18px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.st{--k:var(--neutral);display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;color:var(--k);background:color-mix(in srgb,var(--k) 13%,transparent);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--k)}
.k-good{--k:var(--good)}.k-warn{--k:var(--warn)}.k-bad{--k:var(--bad)}.k-info{--k:var(--info)}.k-neutral{--k:var(--neutral)}.k-accent{--k:var(--accent)}.k-brass{--k:var(--brass)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--fg-2);padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:2px;background:var(--d,var(--accent))}
.tier{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
.tier.New{color:var(--accent)}
.tier.Platinum{color:var(--fg-2)}.tier.Gold{color:var(--brass)}.tier.Standard{color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff;background:var(--av,var(--accent));font-family:var(--f-display)}
.avatar.lg{width:56px;height:56px;font-size:19px}
.avatar.sm{width:28px;height:28px;font-size:11px}
.link{color:var(--accent);font-weight:600;cursor:pointer;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.sig i{width:3px;border-radius:1px;background:var(--line)}
.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:8px}.sig i:nth-child(3){height:12px}
.sig.p1 i:nth-child(-n+1),.sig.p2 i:nth-child(-n+2),.sig.p3 i:nth-child(-n+3){background:var(--pc)}
.pri{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--pc)}

/* KPI */
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:12px;display:flex;gap:6px;align-items:center;color:var(--muted)}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.kpi svg.spark{width:100%;height:30px;display:block}

/* charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--lc)}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 70px;align-items:center;gap:12px;font-size:13px}
.hbar+.hbar{margin-top:11px}
.hbar .track{height:10px;border-radius:5px;background:var(--line-2);display:flex;overflow:hidden}
.hbar .track b{display:block;height:100%}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-2);font-weight:600}

/* feed */
.feed{display:flex;flex-direction:column}
.feed-i{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;padding:11px 0;border-top:1px solid var(--line-2);align-items:start}
.feed-i:first-child{border-top:0;padding-top:2px}
.feed-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--k);background:color-mix(in srgb,var(--k) 13%,transparent)}
.feed-i .t{font-size:13px}
.feed-i .s{font-size:12px;color:var(--muted)}
.feed-i time{font-size:11.5px;color:var(--faint);white-space:nowrap}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--fg)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right}
.cell-client{display:flex;align-items:center;gap:10px}
.cell-client b{font-weight:600;display:block}
.cell-client small{color:var(--muted);font-size:12px}

/* console */
.console{display:grid;grid-template-columns:300px minmax(0,1fr) 330px;gap:16px;align-items:start}
.callbar{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:var(--r);background:var(--rail);color:var(--rail-fg);flex-wrap:wrap}
.callbar .wave{display:flex;gap:3px;align-items:center;height:22px}
.callbar .wave i{width:3px;border-radius:2px;background:var(--accent);animation:wave 1.1s ease-in-out infinite}
.callbar .wave i:nth-child(2){animation-delay:.15s}.callbar .wave i:nth-child(3){animation-delay:.3s}.callbar .wave i:nth-child(4){animation-delay:.45s}.callbar .wave i:nth-child(5){animation-delay:.6s}
.callbar.held .wave i{animation:none;height:4px;background:var(--rail-muted)}
.callbar .timer{font-family:var(--f-mono);font-size:20px;font-weight:500;letter-spacing:.02em}
.callbar .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--rail-muted)}
.callbar .ctrls{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.cbtn{height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--rail-line);background:var(--rail-2);color:var(--rail-fg);display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.cbtn:hover{border-color:var(--rail-muted)}
.cbtn.on{background:var(--brass);color:#1A1306;border-color:var(--brass)}
.cbtn.save{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.callbar .seg{background:var(--rail-2);border-color:var(--rail-line)}
.callbar .seg button{color:var(--rail-muted)}
.callbar .seg button.on{background:var(--rail);color:#fff;box-shadow:0 0 0 1px var(--rail-line)}
.callbar .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--rail-2);color:var(--accent);border:1px solid var(--rail-line)}
.profile{padding:20px}
.profile .head{display:flex;gap:14px;align-items:center}
.profile h2{font-size:18px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;font-size:13px;margin-top:16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.divider{height:1px;background:var(--line-2);margin:16px 0}
.paybox{border-radius:9px;padding:13px 14px;background:color-mix(in srgb,var(--k) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--k) 28%,transparent)}
.paybox .amt{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px}
.tab{padding:14px 12px 12px;border:0;background:none;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:8px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--fg-2)}
.input,select.input,textarea.input{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 11px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:92px;padding:10px 11px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(12,26,36,.12),0 0 0 1px var(--line)}
.route{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:9px;background:var(--accent-soft);color:var(--fg)}
.route .ic{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.route b{font-weight:700}
.route small{display:block;color:var(--muted);font-size:12px}
.svc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.svc{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s}
.svc:hover{border-color:var(--faint)}
.svc.on{border-color:var(--accent);background:var(--accent-soft)}
.svc b{font-size:13px}
.svc small{font-size:11.5px;color:var(--muted)}
.script{border-left:2px solid var(--brass);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:8px}
.script p{margin:0;max-width:68ch;color:var(--fg-2)}
.points{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}
.points li{display:flex;gap:8px;font-size:13px;color:var(--fg-2)}
.points li svg{color:var(--accent);flex:none;margin-top:2px}
.check{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--fg-2)}
.check input{accent-color:var(--accent);width:16px;height:16px}
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl-i{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.tl-i::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:1px;background:var(--line)}

function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m)));const s=[1,2,2.5,5,10].map(x=>x*p).find(x=>x*4>=m)||p*10;return s*4}
function areaChart(vals,labels,h=190,color='var(--accent)'){
  const w=640,pl=40,pr=14,pt=14,pb=26,n=vals.length,max=niceMax(Math.max(...vals));
  const x=i=>pl+i*(w-pl-pr)/(n-1),y=v=>pt+(h-pt-pb)*(1-v/max);
  const line=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  let g='';for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${pl}" x2="${w-pr}" y1="${yy}" y2="${yy}" stroke="var(--line-2)" stroke-width="1"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${v}</text>`}
  const step=Math.ceil(n/7);let xl='';labels.forEach((l,i)=>{if(i%step===0||i===n-1)xl+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${l}</text>`});
  const id='g'+Math.random().toString(36).slice(2,7);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}<path d="${line} L${x(n-1)},${y(0)} L${x(0)},${y(0)} Z" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(n-1)}" cy="${y(vals[n-1])}" r="4.5" fill="var(--surface)" stroke="${color}" stroke-width="2.2"/>${xl}</svg>`;
}
function spark(vals,color='var(--accent)'){
  const w=160,h=30,max=Math.max(...vals),min=Math.min(...vals),n=vals.length;
  const pts=vals.map((v,i)=>`${(i*(w-4)/(n-1)+2).toFixed(1)},${(h-3-(v-min)/(max-min||1)*(h-6)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}
function donut(segs,center,sub,size=150){
  const r=56,C=2*Math.PI*r,tot=segs.reduce((a,s)=>a+s.v,0)||1;let off=0;
  const arcs=segs.map(s=>{const len=s.v/tot*C;const el=`<circle cx="75" cy="75" r="${r}" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${Math.max(len-2,0)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=len;return el}).join('');
  return `<svg viewBox="0 0 150 150" width="${size}" height="${size}" style="flex:none;max-width:100%"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="16"/>${arcs}<text x="75" y="74" text-anchor="middle" style="font:700 22px var(--f-display);fill:var(--fg)">${center}</text><text x="75" y="93" text-anchor="middle" style="font:500 11px var(--f-body);fill:var(--muted)">${sub}</text></svg>`;
}
function groupBars(groups,labels,series,h=220,fmt=v=>v){
  const w=640,pl=52,pr=10,pt=12,pb=26,n=groups.length,max=niceMax(Math.max(...groups.flat()));
  const gw=(w-pl-pr)/n,bw=Math.min(18,gw/(series.length+1.4));
  const y=v=>pt+(h-pt-pb)*(1-v/max);
  let g='';for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${pl}" x2="${w-pr}" y1="${yy}" y2="${yy}" stroke="var(--line-2)"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`}
  let b='';groups.forEach((vals,i)=>{const cx=pl+gw*i+gw/2,start=cx-(vals.length*bw+(vals.length-1)*3)/2;vals.forEach((v,j)=>{b+=`<rect x="${start+j*(bw+3)}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="3" fill="${series[j].c}"><title>${series[j].l}: ${fmt(v)}</title></rect>`});b+=`<text x="${cx}" y="${h-6}" text-anchor="middle">${labels[i]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${g}${b}</svg>`;
}

/* call log actions */
function selectClient(id,dir){
  if(call&&call.items.length)finishCall(true);
  call={client:id,dir,items:[]};ui.pq='';
  ui.reason=dir==='Outgoing'?'payment':'inquiry';ui.outcome='promise';
  closeDrawer();go('console');
}
function changeClient(){if(call.items.length)finishCall(true);call=null;render()}
function finishCall(silent){
  const c=byId(call.client),what=call.items.length?call.items.join(' · '):'General call, nothing to follow up';
  callLog.unshift({client:c.id,dir:call.dir,what,at:Date.now()});
  c.history.push({k:'k-neutral',ic:'phone',t:call.dir+' call',s:what+' · logged by '+ME,at:Date.now()});
  callsToday++;if(!silent)toast('Call log saved',call.dir+' call with '+c.name+' · added to their history');
  call=null;if(!silent)render();
}
const note=s=>{if(call)call.items.push(s)};
function logInquiry(){const c=byId(call.client),s=TOPICS[ui.svc];note('Inquiry · '+s.n);c.history.push({k:'k-info',ic:'info',t:'Inquiry · '+s.n,s:$('#inqNote').value||'Information provided',at:Date.now()});toast('Inquiry logged',s.n);render()}
function createTicket(){
  const c=byId(call.client),cat=$('#tCat').value,dept=$('#tDept').value;
  const t=mkTicket(c.id,cat,'new',0,$('#tSubj').value||CATS[cat].subj[0],$('#tDesc').value);
  t.dept=dept;t.by=ME;t.events[0].t='Ticket logged from '+call.dir.toLowerCase()+' call';t.events[0].s=ME+' · routed to '+dept;t.fresh=true;
  c.history.push({k:'k-info',ic:'ticket',t:t.id+' · '+t.subject,s:dept+' · New',at:Date.now()});
  note('Complaint · '+t.id+' to '+dept);
  toast('Ticket '+t.id+' created','Routed to '+dept+' · give the client this number');render();
}
function logPayment(){
  const c=byId(call.client),due=payOf(c.id).filter(p=>!isPaid(p)),o=ui.outcome,amt=+($('#pAmt')||{}).value||0;
  if(o==='promise'){const d=new Date($('#pDate').value||addDays(5));due.forEach(p=>{p.status='promised';p.promise=d;p.lastContact=Date.now()});c.history.push({k:'k-brass',ic:'wallet',t:'Promise to pay '+money(amt),s:'On '+fdate(d)+' · '+$('#pNote').value,at:Date.now()});note('Payment · promise saved');toast('Payment promise saved','Due '+fdate(d)+' · shows in Payment reports')}
  if(o==='paid'){due.forEach(p=>{p.status=p.promise?'kept':'paid';p.paidOn=TODAY;p.lastContact=Date.now()});c.paidCount++;c.history.push({k:'k-good',ic:'wallet',t:'Payment recorded '+money(amt),s:$('#pNote').value,at:Date.now()});note('Payment · recorded');toast('Payment recorded','Balance updated')}
  if(o==='noanswer'){let moved=0;due.forEach(p=>{p.attempts++;p.lastContact=Date.now();if(p.attempts>=3&&p.status==='overdue'){p.status='unreachable';moved++}});c.history.push({k:'k-neutral',ic:'phone',t:'Call attempt · no answer',s:$('#pNote').value,at:Date.now()});note('Payment · no answer');toast('Call attempt saved',moved?'Moved to Not answering after 3 attempts':'Attempt '+due[0].attempts+' recorded')}
  render();
}

  <div class="board-wrap"><div class="board">

    ${items.map(t=>{const c=byId(t.client);const f=t.fresh;t.fresh=false;return `<button class="tcard ${f?'new-flash':''}" onclick="openTicket('${t.id}')"><div class="row"><span class="mono muted">${t.id}</span>${dtag(t.dept)}</div><div class="subj">${esc(t.subject)}</div><div class="meta">${av(c,'sm')}<span>${esc(c.name)}</span></div><div class="row"><span class="muted" style="font-size:12px">${t.cat}</span>${age(t)}</div></button>`}).join('')||'<div class="empty" style="padding:18px;font-size:12.5px">Nothing here</div>'}
  </div></div>`}).join('')}
  </div></div>`;
}

/* ---------- SALES CALLBACKS ---------- */
function renderCallbacks(){
  const aw=awaiting().sort((a,b)=>a.resolvedAt-b.resolvedAt);
  const closed=tickets.filter(t=>t.status==='closed').length;
  return `<div class="phead"><div><div class="eyebrow">Sales team</div><h1>Sales callbacks</h1><p>When a department marks a ticket resolved, Sales gets notified here. Call the client from your phone, then record the result below.</p></div></div>
  <div class="grid g-kpi" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div class="card kpi"><div class="eyebrow">Waiting for callback</div><div class="v">${aw.length}</div><div class="d">Oldest ${aw[0]?ago(aw[0].resolvedAt):'—'}</div></div>
    <div class="card kpi"><div class="eyebrow">Confirmed this week</div><div class="v">${closed+37}</div><div class="d">Closed after client confirmed</div></div>
    <div class="card kpi"><div class="eyebrow">Reopened after callback</div><div class="v">4.8%</div><div class="d">Client said the issue was not fixed</div></div>
  </div>
  <div class="card">${aw.length?aw.map(t=>{const c=byId(t.client);return `<div class="cb">
    <div style="display:flex;gap:12px;align-items:center;min-width:0">${av(c)}<div style="min-width:0"><b>${esc(c.name)}</b><div class="muted" style="font-size:12.5px">${sub(c)}</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"><button class="link mono" onclick="openTicket('${t.id}')">${t.id}</button>${dtag(t.dept)}${t.cbAttempts?st('k-warn',t.cbAttempts+' attempt'+(t.cbAttempts>1?'s':'')+' · no answer'):''}</div></div></div>
    <div class="res"><b>${esc(t.subject)}</b>${esc(t.resolution)}<div class="muted" style="font-size:11.5px;margin-top:4px">Resolved by ${t.dept} · ${ago(t.resolvedAt)}</div></div>
    <div class="acts"><button class="btn primary sm" onclick="cbOutcome('${t.id}','ok')">${icon('check',14)}Client confirmed</button><button class="btn sm" onclick="cbOutcome('${t.id}','na')">No answer</button><button class="btn sm" onclick="cbOutcome('${t.id}','reopen')">${icon('refresh',14)}Not fixed · reopen</button></div>
  </div>`}).join(''):`<div class="empty">${icon('check',22)}<p>All resolved tickets are confirmed with clients.</p></div>`}</div>`;
}
function cbOutcome(id,o){
  const t=tickets.find(x=>x.id===id),c=byId(t.client);
  if(o==='ok'){t.status='closed';t.events.push({k:'k-good',t:'Client confirmed the fix',s:'Sales callback by '+c.owner+' · ticket closed',at:Date.now()});c.history.push({k:'k-good',ic:'check',t:t.id+' closed',s:'Client confirmed the fix',at:Date.now()});toast(t.id+' closed',c.name+' confirmed the issue is fixed')}
  if(o==='na'){t.cbAttempts++;t.events.push({k:'k-warn',t:'Callback attempt '+t.cbAttempts+' · no answer',s:'Sales will try again',at:Date.now()});toast('No answer saved','Ticket stays in Sales callbacks')}
  if(o==='reopen'){t.status='progress';t.events.push({k:'k-bad',t:'Reopened after callback',s:'Client says the issue is not fixed · sent back to '+t.dept,at:Date.now()});toast(t.id+' reopened','Sent back to '+t.dept)}
  notifs.filter(n=>n.ticket===id).forEach(n=>n.read=true);
  render();refreshDrawer();
}

/* ---------- REPORTS ---------- */
function renderReports(){
  return `<div class="phead"><div><div class="eyebrow">Reports</div><h1>Reports</h1><p>Who paid, who didn't, who promised, and whether they kept their promise.</p></div>
  <div class="actions"><div class="seg">${['This month','Last 30 days','Quarter','Year to date'].map(p=>`<button class="${ui.period===p?'on':''}" onclick="ui.period='${p}';segOn(this)">${p}</button>`).join('')}</div></div></div>
  <div class="tabs card" style="box-shadow:none;border-radius:var(--r);padding:0 10px">
    ${[['payments','wallet','Payments & promises'],['tickets','ticket','Tickets & calls']].map(([k,ic,l])=>`<button class="tab ${ui.rep===k?'on':''}" onclick="ui.rep='${k}';render()">${icon(ic)}${l}</button>`).join('')}
  </div>
  ${ui.rep==='payments'?payReport():ticketReport()}`;
}
function payReport(){
  const S=Object.keys(PSTAT);
  const agg=s=>{const l=payments.filter(p=>p.status===s);return {n:l.length,a:l.reduce((x,p)=>x+p.amount,0)}};
  const kept=agg('kept').n,broken=agg('broken').n,rate=Math.round(kept/((kept+broken)||1)*100);
  const unpaid=payments.filter(p=>!isPaid(p));
  const buckets=[[0,30],[31,60],[61,90],[91,999]].map(([a,b])=>{const l=unpaid.filter(p=>daysLate(p)>=a&&daysLate(p)<=b);return {l:b>900?'90+ days':a+'–'+b+' days',n:l.length,a:l.reduce((x,p)=>x+p.amount,0)}});
  const weeks=['W35','W36','W37','W38','W39','W40','W41','W42'];
  const prom=[2.1,2.6,1.9,3.2,2.8,3.6,3.1,3.9],coll=[1.6,2.0,1.5,2.5,2.4,2.9,2.7,3.4],brk=[.5,.6,.4,.7,.4,.7,.4,.5];
  const ag=AGENTS.map(a=>{const l=payments.filter(p=>p.agent===a);const k=l.filter(p=>p.status==='kept').length,b=l.filter(p=>p.status==='broken').length,pr=l.filter(p=>p.status==='promised').length;return {a,n:l.length,k,b,pr,coll:l.filter(isPaid).reduce((x,p)=>x+p.amount,0),rate:k+b?Math.round(k/(k+b)*100):100}});
  let rows=payments.filter(p=>(ui.rstat==='all'||p.status===ui.rstat));
  const q=ui.rq.toLowerCase();if(q)rows=rows.filter(p=>{const c=byId(p.client);return (c.name+c.phone+p.plan).toLowerCase().includes(q)});
  const key={due:p=>p.due,amount:p=>p.amount,late:p=>daysLate(p),client:p=>byId(p.client).name,promise:p=>p.promise?p.promise.getTime():0}[ui.rsort];
  rows.sort((a,b)=>(key(a)>key(b)?1:key(a)<key(b)?-1:0)*ui.rdir);
  const th=(k,l,cls='')=>`<th class="sortable ${cls}" onclick="sortBy('${k}')">${l}${ui.rsort===k?(ui.rdir>0?' ↑':' ↓'):''}</th>`;
  const totalA=rows.reduce((x,p)=>x+p.amount,0);
  return `

/* ---------- drawer ---------- */
function openDrawer(){$('#drawer').classList.add('open');$('#scrim').classList.add('open');$('#drawer').setAttribute('aria-hidden','false')}
function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');drawerState.type=null}
function refreshDrawer(){if(drawerState.type==='ticket')openTicket(drawerState.id);else if(drawerState.type==='client')openClient(drawerState.id)}
function openTicket(id){
  hideMenu();const t=tickets.find(x=>x.id===id);if(!t)return;const c=byId(t.client);drawerState.type='ticket';drawerState.id=id;
  let act='';
  if(t.status==='new')act=`<div class="actbox"><div class="actas">${icon('building',13)}Acting as ${t.dept}</div><div class="field"><label for="reDept">Department</label><select class="input" id="reDept">${DEPTS.map(d=>`<option ${d===t.dept?'selected':''}>${d}</option>`).join('')}</select></div><div class="actions"><button class="btn primary" onclick="accept('${t.id}')">${icon('check')}Accept & start work</button></div></div>`;
  if(t.status==='progress')act=`<div class="actbox"><div class="actas">${icon('building',13)}Acting as ${t.dept}</div><div class="field"><label for="resNote">What was done to fix it</label><textarea class="input" id="resNote" rows="3">${esc(RES[t.cat]||'Issue fixed and checked by the department.')}</textarea></div><div class="actions"><button class="btn primary" onclick="resolveT('${t.id}')">${icon('send')}Mark resolved & notify Sales</button></div><div class="muted" style="font-size:12px">${c.owner} (Sales) gets a notification to call the client and confirm.</div></div>`;
  if(t.status==='resolved')act=`<div class="callout" style="--k:var(--accent)">${icon('bell')}<div><b>Sales has been notified.</b><br>${c.owner} needs to call ${esc(c.name)} on <span class="num">${esc(c.phone)}</span> to confirm the fix.</div></div><div class="actbox"><div class="actas">${icon('users',13)}Acting as Sales · ${c.owner}</div><div class="actions"><button class="btn primary" onclick="cbOutcome('${t.id}','ok')">${icon('check')}Client confirmed</button><button class="btn" onclick="cbOutcome('${t.id}','na')">No answer</button><button class="btn" onclick="cbOutcome('${t.id}','reopen')">${icon('refresh')}Not fixed · reopen</button></div></div>`;
  if(t.status==='closed')act=`<div class="callout" style="--k:var(--good)">${icon('check')}<div><b>Closed.</b> The client confirmed the issue is fixed.</div></div>`;
  $('#drawer').innerHTML=`<div class="dr-h"><span class="mono muted">${t.id}</span>${tst(t)}<button class="iconbtn" style="margin-left:auto" aria-label="Close" onclick="closeDrawer()">${icon('x')}</button></div>
  <div class="dr-b">
    <div><h2 style="font-size:20px">${esc(t.subject)}</h2><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center">${dtag(t.dept)}${age(t)}</div></div>
    <button class="tcard" style="flex-direction:row;align-items:center;gap:12px" onclick="openClient('${c.id}')">${av(c)}<div style="flex:1;min-width:0"><b>${esc(c.name)}</b><div class="muted" style="font-size:12.5px">${sub(c)}</div></div></button>
    <div class="factgrid"><div><small>Complaint type</small><span>${t.cat}</span></div><div><small>Created</small><span>${fdate(t.created)}, ${ftime(t.created)}</span></div><div><small>Logged by</small><span>${t.by}</span></div><div><small>Account manager</small><span>${c.owner}</span></div><div><small>Plan</small><span class="mono">${c.plan||'—'}</span></div><div><small>Channel</small><span>Phone call</span></div></div>
    <div class="dr-sec"><h4>Description</h4><p style="margin:0;color:var(--fg-2)">${esc(t.desc)}</p></div>
    ${act}
    <div class="dr-sec"><h4>Timeline</h4><div class="tl">${t.events.slice().reverse().map(e=>`<div class="tl-i"><div class="tl-dot" style="--k:var(--${e.k.slice(2)})">${icon('check',11)}</div><div><div class="t">${esc(e.t)}</div><div class="s">${esc(e.s)} · ${fdate(e.at)}, ${ftime(e.at)}</div></div></div>`).join('')}</div></div>
  </div>`;
  openDrawer();
}
function accept(id){const t=tickets.find(x=>x.id===id);const d=$('#reDept').value;if(d!==t.dept){t.events.push({k:'k-info',t:'Reassigned to '+d,s:'From '+t.dept,at:Date.now()});t.dept=d}t.status='progress';t.events.push({k:'k-brass',t:t.dept+' accepted the ticket',s:'Work started',at:Date.now()});toast(t.id+' in progress',t.dept+' is working on it');render();refreshDrawer()}
function resolveT(id){
  const t=tickets.find(x=>x.id===id),c=byId(t.client);t.status='resolved';t.resolution=$('#resNote').value;t.resolvedAt=Date.now();
  t.events.push({k:'k-accent',t:'Resolved by '+t.dept,s:t.resolution,at:Date.now()});
  t.events.push({k:'k-brass',t:'Sales notified to confirm with client',s:'Callback task created for '+c.owner,at:Date.now()+1});
  notifs.unshift({id:'N'+t.id+Date.now(),ticket:t.id,t:t.dept+' resolved '+t.id,s:'Call '+c.name+' to confirm the fix',at:Date.now(),read:false});
  toast('Sales notified',c.owner+' will call '+c.name+' to confirm');render();refreshDrawer();
}

    <div class="dr-sec"><h4>Installment plan</h4>${ps.length?`<div class="muted" style="font-size:12.5px;margin-bottom:8px"><span class="mono">${c.plan}</span> · ${c.months} months × ${money(c.inst)} · ${c.paidCount} of ${c.months} paid</div><div class="tbl-wrap" style="border:1px solid var(--line);border-radius:9px"><table class="tbl"><thead><tr><th>Installment</th><th class="r">Amount</th><th>Due</th><th>Promised</th><th>Status</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${p.no} of ${p.of}</td><td class="r num">${money(p.amount)}</td><td>${fdate(p.due)}</td><td>${p.promise?fdate(p.promise):'—'}</td><td>${pst(p)}</td></tr>`).join('')}</tbody></table></div>`:'<span class="muted">No installment plan yet.</span>'}</div>
    <div class="dr-sec"><h4>Tickets</h4><div style="display:flex;flex-direction:column;gap:8px">${ts.length?ts.map(t=>`<button class="tcard" onclick="openTicket('${t.id}')"><div class="row"><span class="mono muted">${t.id}</span>${tst(t)}</div><div class="subj">${esc(t.subject)}</div><div class="meta">${dtag(t.dept)}<span>${fdate(t.created)}</span></div></button>`).join(''):'<span class="muted">No tickets.</span>'}</div></div>

    </div>

    </div>
    <div id="ncErr"></div>

function saveClient(){
  const v=id=>$('#'+id).value.trim();
  const name=v('ncName'),phone=v('ncPhone'),city=v('ncCity'),digits=phone.replace(/\D/g,'');
  ['ncName','ncPhone','ncCity'].forEach(i=>$('#'+i).style.borderColor=v(i)?'':'var(--bad)');
  const err=(k,html)=>{$('#ncErr').innerHTML=`<div class="callout" style="--k:var(--${k})">${icon('alert')}<div>${html}</div></div>`};
  const miss=[!name&&'full name',!phone&&'mobile number',!city&&'city'].filter(Boolean);
  if(miss.length)return err('bad','Add the '+miss.join(', ')+' to save this client.');
  if(digits.length<10){$('#ncPhone').style.borderColor='var(--bad)';return err('bad','The mobile number looks too short. Use 11 digits, for example 010 1234 5678.')}
  const dup=clients.find(c=>c.phone.replace(/\D/g,'').slice(-10)===digits.slice(-10));
  if(dup)return err('warn',`This number already belongs to <b>${esc(dup.name)}</b>. <button type="button" class="link" onclick="openClient('${dup.id}')">Open their file</button>`);
  const id='C'+String(clients.length+1).padStart(3,'0');
  const c={id,name,phone,city,since:new Date().getFullYear(),owner:ME,plan:'',months:0,financed:0,inst:0,paidCount:0,history:[]};
  c.history.push({k:'k-good',ic:'plus',t:'Client created',s:'By '+ME+' · source: phone call',at:Date.now()});
  if(v('ncNote'))c.history.push({k:'k-neutral',ic:'info',t:'Note',s:v('ncNote'),at:Date.now()+1});
  clients.push(c);
  toast('Client saved','Now record what '+name.split(' ')[0]+' asked about');
  selectClient(id,'Incoming');
}

/* ---------- notifications ---------- */
function toggleMenu(e){e.stopPropagation();const m=$('#menu');if(!m.hidden){hideMenu();return}
  m.innerHTML=`<div class="menu-h"><b>Notifications</b><button class="link" onclick="notifs.forEach(n=>n.read=true);hideMenu();renderNav()">Mark all read</button></div><div style="max-height:420px;overflow:auto">${notifs.slice().sort((a,b)=>b.at-a.at).map(n=>`<button class="menu-i ${n.read?'':'unread'}" onclick="openNotif('${n.id}')"><div class="feed-ic" style="--k:var(${n.ticket?'--accent':'--brass'})">${icon(n.ticket?'bell':'wallet',15)}</div><div><div class="t"><b>${esc(n.t)}</b></div><div class="s">${esc(n.s)} · ${ago(n.at)}</div></div></button>`).join('')}</div>`;
  m.hidden=false}
function hideMenu(){$('#menu').hidden=true}
function openNotif(id){const n=notifs.find(x=>x.id===id);n.read=true;hideMenu();renderNav();if(n.ticket)openTicket(n.ticket);else go(n.go||'overview')}
document.addEventListener('click',e=>{if(!$('#menu').hidden&&!e.target.closest('#menu'))hideMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();hideMenu()}});

/* ---------- router ---------- */
const VIEWS={overview:renderOverview,console:renderConsole,tickets:renderTickets,callbacks:renderCallbacks,reports:renderReports,clients:renderClients};
let view='overview';
function go(v){view=VIEWS[v]?v:'overview';try{history.replaceState(null,'','#'+view)}catch(e){}render();$('#scroll').scrollTop=0;window.scrollTo(0,0)}
function render(){renderNav();$('#view').innerHTML=VIEWS[view]()}
function globalSearch(q){q=q.trim().toLowerCase();if(!q)return;const qs=q.replace(/\s/g,'');const t=tickets.find(x=>x.id.toLowerCase()===q||x.id.toLowerCase().endsWith(q));if(t)return openTicket(t.id);const c=clients.find(x=>(x.name+x.phone).toLowerCase().replace(/\s/g,'').includes(qs));if(c)return openClient(c.id);const p=payments.find(x=>x.plan.toLowerCase().includes(q));if(p)return openClient(p.client);toast('No match for "'+q+'"','Try a client name, mobile number or ticket number')}

const h=(location.hash||'').slice(1);go(VIEWS[h]?h:'overview');
</script>

</body></html>
